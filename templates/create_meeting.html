<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  
  <meta charset="utf-8" />
  <title>Create Meeting - Online Meeting App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <div class="brand">Online Meeting App</div>
    <div class="user">
      <a href="{{ url_for('dashboard') }}">Dashboard</a> |
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>

  <div class="box main">
    <h2>Create Meeting</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
        {% for category, msg in messages %}
          <div class="alert {{ category }}">{{ msg }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('create_meeting') }}" id="createForm">
      <input name="title" placeholder="Meeting title" required />
      <input name="date" placeholder="Date (YYYY-MM-DD)" required />
      <input name="start_time" placeholder="Start time (HH:MM:SS)" required />
      <input name="duration" placeholder="Duration (minutes)" required />
      <button type="submit">Create</button>
    </form>

    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
